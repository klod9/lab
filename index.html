<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>Access Required</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { serif: ['"Cormorant Garamond"', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] },
      colors: { navy: '#0f1b2d', gold: '#a8814a', paper: '#f7f6f3' }
    } } };
  </script>
  <style>
    :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4rem); background: #f7f6f3; }
    body { background: #f7f6f3; }
    .reveal { opacity: 0; transform: translateY(12px); transition: opacity .8s ease, transform .8s ease; }
    .reveal.show { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { transition: none; opacity: 1; transform: none; } }
  </style>

  <style>
    #gate{animation:gf .9s ease both}
    @keyframes gf{from{opacity:0}}
    #intro{display:none;position:fixed;inset:0;z-index:50;background:#f7f6f3;align-items:center;justify-content:center;padding:1.5rem;transition:opacity .9s ease,visibility .9s}
    .intro #intro{display:flex}
    #intro.out{opacity:0;visibility:hidden}
    .w{display:inline-block;opacity:0;transform:translateY(26px);filter:blur(8px);animation:wi 1.1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.4s + .3s)}
    @keyframes wi{to{opacity:1;transform:none;filter:none}}
    @media (prefers-reduced-motion:reduce){#gate{animation:none}.w{animation:none;opacity:1;transform:none;filter:none}}
  </style>
</head>
<body class="font-sans text-slate-600 bg-paper antialiased">
  <main id="gate" class="min-h-screen flex items-center justify-center px-6">
    <form id="f" class="w-full max-w-xs text-center" autocomplete="off">
      <label for="pw" class="block text-xs font-medium tracking-[0.35em] text-navy uppercase">Access Code</label>
      <input id="pw" type="password" maxlength="12" autocomplete="off" autocapitalize="characters" enterkeyhint="go" spellcheck="false" required
        class="mt-6 w-full bg-transparent border-0 border-b border-slate-300 py-2 text-center text-2xl tracking-[0.5em] uppercase text-navy focus:outline-none focus:border-gold transition-colors">
      <p class="mt-6 text-xs font-light text-slate-400">Hint: the sender’s initials, in the same format as yours — P.E.A.</p>
      <p id="err" role="alert" class="mt-4 text-xs text-red-700 min-h-4"></p>
    </form>
  </main>
  <div id="intro" aria-label="Happy Birthday, Erich">
    <h1 class="flex flex-wrap justify-center gap-x-4 font-serif text-5xl sm:text-7xl font-semibold text-navy text-center leading-tight">
      <span class="w" style="--i:0">Happy</span><span class="w" style="--i:1">Birthday,</span><span class="w text-gold italic" style="--i:2">Erich!</span>
    </h1>
  </div>
  <div id="app"></div>

  <!-- ===== PAGE CONTENT (shown after the correct access code). Edit your messages here. ===== -->
  <template id="content">
<nav class="fixed inset-x-0 z-10 bg-paper/90 backdrop-blur border-b border-slate-200" style="top:env(safe-area-inset-top,0px)">
    <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between text-sm">
      <span class="font-serif text-lg font-semibold tracking-widest text-navy">P.E.A.</span>
      <div class="flex gap-8 text-slate-500">
        <a href="#message" class="hover:text-navy transition">Message</a>
        <a href="#apology" class="hover:text-navy transition">Make Up</a>
      </div>
    </div>
  </nav>

  <header class="min-h-screen flex items-center justify-center text-center px-6 pt-14">
    <div class="reveal max-w-2xl">
      <p class="text-sm font-medium tracking-[0.3em] text-gold uppercase">October 4</p>
      <h1 class="mt-6 font-serif text-5xl sm:text-7xl font-semibold text-navy leading-[1.05]">Happy Birthday,<br>Honey!</h1>
      <div class="w-12 h-px bg-gold mx-auto my-8"></div>
      <p class="max-w-md mx-auto text-lg font-light text-slate-500 leading-relaxed">
        Wishing you a year as graceful, warm, and beautiful as you are.
      </p>
      <a href="#message" class="inline-block mt-12 px-7 py-3 text-sm font-medium tracking-wide text-white bg-navy rounded-md hover:bg-slate-800 transition">Read my message</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-24 space-y-28">

    <section id="message" class="reveal">
      <p class="text-xs font-medium tracking-[0.3em] text-gold uppercase text-center">Birthday Message</p>
      <h2 class="mt-3 mb-10 font-serif text-4xl font-semibold text-navy text-center">With All My Gratitude</h2>
      <!-- ✏️ EDIT YOUR BIRTHDAY MESSAGE: change the text inside the <p> below -->
      <article class="bg-white rounded-lg border border-slate-200 border-t-2 border-t-gold shadow-sm p-8 sm:p-14">
        <p class="font-serif text-xl sm:text-2xl leading-[1.75] text-slate-800">
          Happy, happy birthday to the most beautiful woman on earth, my Erich Anne! Thank you for choosing to love me. Out of all the guys in this world, knowing that you chose me makes me feel like the luckiest and best man alive despite knowing all those you had experience in your past, ikaw lang naman nagmamatter saken, honey, and you still deserve the purest kind of love, and genuine kind of love okay? kaya don't think that you don't deserve one when every time you remember about your past. YK, I am endlessly grateful for your heart and everything you bring into my life, ikaw lang naman yung nagpaint sa dati kong pale looking na buhay binago mo and you made it colorful. Ikaw lang yung taong nakilala kong napaka-genuine yung personality and may emotional intelligence on par with me, napakabait mo pa, minsan lang din talaga kinukulang lang sa pasensya kaya nag e-errupt ikaw kaagad, pero if they know how to treat you right edi mafifeel din nila yung pinapafeel mo saken na kabaitan. Tapos ang tali-talino mo pa, alam ko rin talaga na marami ka ring hidden potentials pa honey, hindi mo pa nailalabas, you'd be so productive by the time that happens, napaka-soft girl mo pa, baby na baby ka pa talaga namin ng mom mo, ang cutiee patootiee na baby super pretty, mana kay tita na yan ay, ay. Kiss kaya kita sa harap ni tita? I hope this year brings you as much happiness as you endlessly give to me. I pray that God continues to bless you with good health, joy and most especially, peace; mentally, physically and now, spiritually. I love you more than words can express, palagi ko lang yan sinasabi kasi totoo talaga yan e. At Baby, I look forward to celebrating many more birthdays with you and making more memories together, syempre that includes yung dinner later sa Vikings-SM North na nilolook forward ko! Just know honey that I will always be here to support you and love you through everything, mahal na mahal kita. And, I pray also thay god continues to bless our relationship and that we will always be together, forever! Plus, I pray also na i-guide niya tayo sa lahat ng ating mga desisyon at patuloy tayong patatagin sa lahat ng challenges na darating sa ating buhay, that includes yung pinag-usapan natin once you're officially 21. I love you so much, my Erich Anne! ikaw at ikaw lang ang baby, baby ko, Happy 21st birthday, Pretty!
      </article>
    </section>

    <section id="apology" class="reveal">
      <p class="text-xs font-medium tracking-[0.3em] text-gold uppercase text-center">From the Heart</p>
      <h2 class="mt-3 mb-10 font-serif text-4xl font-semibold text-navy text-center">Make Up</h2>
      <!-- ✏️ EDIT YOUR APOLOGY MESSAGE: change the text inside the <p> below -->
      <article class="bg-navy rounded-lg shadow-lg p-8 sm:p-14">
        <p class="text-lg sm:text-xl leading-[1.8] font-light text-slate-200">
          I also want to take this moment to sincerely apologize. I am truly sorry for my mistake, sorry talaga hon, for not doing what you asked me to do before na mag-advance paalam na ganon, and I hate that it’s too late now. ofc, I take full accountability for my oversight and the frustration it caused you. Promise hon, I am learning from this, and I want to do better by you because you deserve someone who listens, sinusunod ka ganon, and pinapahalagahan mga sinasabi mo. I also promise to be more better than my present self, so in the future hindi na kita masasaktan ulit ng ganito. Plus, I will make sure na you won't ever gon' feel na ikaw nalang lagi nag p'plan kada may occasion tayo, kung saan tayo ganon, what are we gon' eat ganon. Since, I really wanna stand up, lalo I am the guy here and I'm afraid I might lose you because of that. Plus, I really don't want you to feel na I don't care or hindi ako excited kapag ganon or hindi ko nil'look forward yung mga ganon. Kaya this time for sure, it won't cause you much time na thinking about sa next occasion plannings natin, I will be planning ahead of time, days before the occasion. I love you so much, baby! and sorry so much! Happy birthday, mwaa!
        </p>
      </article>
    </section>

    <section class="reveal text-center">
      <div class="w-12 h-px bg-gold mx-auto mb-8"></div>
      <p class="font-serif text-3xl font-semibold text-navy">I Love You So Much!</p>
    </section>
  </main>

  <footer class="border-t border-slate-200 py-8 text-center text-xs tracking-widest text-slate-400 uppercase">October 4</footer>
  </template>

  <script>
    const CODE_HASH='807e7c542324d83c0bbf1a1e99c2fe68715b4246b3d8c641dabd5bbf7cf5f036'; // SHA-256 of the access code
    const $=id=>document.getElementById(id);
    const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
    $('f').onsubmit=async e=>{
      e.preventDefault();
      const err=$('err');err.textContent='';
      let ok=false;
      try{ok=(await sha($('pw').value.replace(/[.\s]/g,'').toUpperCase()))===CODE_HASH}
      catch(_){err.textContent='A secure (https) connection is required.';return}
      if(!ok){err.textContent='Incorrect code. Please try again.';$('pw').select();return}
      $('pw').blur();$('gate').remove();
      $('app').appendChild($('content').content.cloneNode(true));
      document.title='Happy Birthday, Gorgeous!';
      document.body.classList.add('intro');
      document.body.style.overflow='hidden';
      window.scrollTo(0,0);
      setTimeout(()=>{
        $('intro').classList.add('out');
        document.body.style.overflow='';
        const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('show')),{threshold:.15});
        document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
        setTimeout(()=>$('intro').remove(),1000);
      },3400);
    };
  </script>
</body>
</html>
